[project]
name = "mirage"
version = "0.1.0"
description = "Secure facial recognition authentication for Linux. Windows Hello™ inspired, PAM-integrated, NPU-accelerated"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.4.1",
  "cryptography>=48.0.1",
  "numpy>=2.4.6",
  "onnxruntime>=1.26.0",
  "opencv-python-headless>=4.13.0.92",
  "rich>=15.0.0",
  "toml>=0.10.2",
  "tomlkit>=0.15.1",
]

[tool.ruff]
line-length = 150

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
